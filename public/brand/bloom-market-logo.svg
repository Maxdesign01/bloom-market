<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" role="img" aria-label="Bloom Market">
  <title>Bloom Market</title>
  <!-- Leaf -->
  <path d="M40 150 C 8 148 0 128 4 106 C 26 108 44 124 40 150 Z" fill="#6FA83C"/>
  <!-- Stem / tail that continues below the wordmark baseline -->
  <path d="M148 126 C 152 152 150 176 142 196 L 158 196 C 165 174 166 150 162 126 Z" fill="#7CB342"/>
